name: Verify and deploy Pico
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pico-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify the interface
        env:
          PICO_WEBKIT: '1'
        run: |
          npm run dev > /tmp/pico-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:5174/pico/ > /dev/null
          npm run test:ui
          npm run test:streaming
          node scripts/check-agents.mjs
      - name: Validate the production bundle
        run: npx cf deploy --dry-run
      - name: Deploy keff.uk/pico
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '05838fc24a89cefaf6081066cca13544'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Configure the Cloudflare deployment secret.'; exit 1; }
          npx cf deploy --prebuilt --tag "${{ github.sha }}"
      - name: Verify public deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          node scripts/smoke-live.mjs
          PICO_URL=https://keff.uk/pico node scripts/check-agents.mjs
